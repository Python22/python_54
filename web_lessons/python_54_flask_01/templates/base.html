<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- создаём блок для изменения названия вкладки в дочерних шаблонах -->
    <title>{% block title %}{% endblock %}</title>
    <!-- подключаем css Ффайл из статичной области и менно так -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <!-- создаём блок для подключения других css файлов в дочерних шаблонах -->
    {% block css_block %}{% endblock %}
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/main_logo.png') }}" type="image/x-icon">
</head>
<body>
    <header>
        <nav id="main_menu">
            <a href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='img/main_logo.png') }}" alt="main logo"></a>
            <a href="{{ url_for('index') }}" class="main_menu_btn">Главная</a>
            <a href="{{ url_for('game') }}" class="main_menu_btn">Одиночная игра</a>
            <a href="{{ url_for('multiplayer') }}" class="main_menu_btn">Мультиплеер</a>
            <a href="{{ url_for('hello') }}" class="main_menu_btn">hello</a>
        </nav>
    </header>
    
    <main>
        {% block main_block %}{% endblock %}
    </main>

    <footer>

    </footer>
    {% block js_block %}{% endblock %}
</body>
</html>
