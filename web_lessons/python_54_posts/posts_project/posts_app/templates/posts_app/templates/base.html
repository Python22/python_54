<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block 'title' %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'posts_app/static/css/base.css' %}">
    {% block 'css_block' %}{% endblock %}
</head>
<body>
    <header>
        <nav id="main_menu">
            <!-- {% url 'posts_app:all_posts' %} означает что берём адрес из файла urls внтри приложения posts_app, адрес с именем(name) all_posts-->
            <a href="{% url 'posts_app:all_posts' %}"><img src="" alt="main_logo" id="main_logo"></a>
            <a href="{% url 'posts_app:all_posts' %}" class="main_menu_btn">Главная</a>
            <a href="{% url 'posts_app:add_new_post' %}" class="main_menu_btn">Добавить пост</a>
            <a href="#" class="main_menu_btn">Меню 3</a>
            <a href="#" class="main_menu_btn">Меню 4</a>
        </nav>
        <div id="auth_div">
            <a href="{% url 'auth_app:login' %}">Войти</a>
            <a href="{% url 'auth_app:register' %}">Создать аккаунт</a>
        </div>
    </header>
    <main>
        {% block 'main_block' %}{% endblock %}
    </main>

    <footer>

    </footer>
    {% block 'js_block' %}{% endblock %}
</body>
</html>
